services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: remote-dev-kit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: remote_dev_kit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: remote-dev-kit-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/remote_dev_kit
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production-minimum-32-characters
      - JWT_REFRESH_SECRET=your-super-secret-refresh-key-change-in-production-minimum-32-characters
      - JWT_RESET_SECRET=your-super-secret-reset-key-change-in-production-minimum-32-characters
      - JWT_EXPIRES_IN=7d
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USER=your-email@gmail.com
      - EMAIL_PASS=your-app-password
      - GITHUB_CLIENT_ID=your-github-client-id
      - GITHUB_CLIENT_SECRET=your-github-client-secret
      - GITHUB_CALLBACK_URL=http://localhost:4000/api/auth/github/callback
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/db/prisma:/app/packages/db/prisma:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local